openapi: 3.0.0
info:
  title: Jobster API
  description: |
    Jobster API — register/login, профіль і CRUD для власних job з пошуком, фільтрами, пагінацією та статистикою (JWT Bearer).

    Демо-юзер `testUser@test.com` / `secret` — read-only: зміни даних повертають 400 `Test User. Read Only!`.
  version: '1.0'
servers: # відносний URL — Try it out іде на той самий домен, що й /api-docs (локально і на Render; CSP helmet не блокує)
  - url: /api/v1
    description: Current host
paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register User
      operationId: RegisterUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest' # схема описана один раз у components
            example:
              name: Peter
              email: peter@mail.com
              password: secret
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Validation error or duplicate email
        '429':
          description: Too many requests (10 per 15 min per IP)
      security: [] # перекриває глобальний security — register без токена
  /auth/login:
    post:
      tags: [Auth]
      summary: Login User
      operationId: LoginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginUserRequest'
            example:
              email: testUser@test.com
              password: secret
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid credentials
        '429':
          description: Too many requests (10 per 15 min per IP)
      security: []
  /auth/updateUser:
    patch:
      tags: [Auth]
      summary: Update User
      operationId: UpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              email: peter@mail.com
              name: Peter
              lastName: Parker
              location: Kyiv
      responses:
        '200':
          description: OK — returns the user with a fresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Missing values, validation error, duplicate email, or demo user (read-only)
        '401':
          description: Missing or invalid token
  /jobs:
    post:
      tags: [Jobs]
      summary: Create Job
      operationId: CreateJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
            example:
              company: google
              position: intern
              status: pending
              jobType: remote
              jobLocation: Kyiv
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400':
          description: Validation error, or demo user (read-only)
    get:
      tags: [Jobs]
      summary: Get All Jobs
      description: Пошук, фільтри, сортування й пагінація — усі параметри необов'язкові.
      operationId: GetAllJobs
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Підрядок у position, без урахування регістру
        - in: query
          name: status
          schema:
            type: string
            enum: [all, interview, declined, pending]
        - in: query
          name: jobType
          schema:
            type: string
            enum: [all, full-time, part-time, remote, internship]
        - in: query
          name: sort
          schema:
            type: string
            enum: [latest, oldest, a-z, z-a]
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
                  totalJobs:
                    type: integer
                    description: Скільки всього job під ці фільтри
                  numOfPages:
                    type: integer
  /jobs/stats:
    get:
      tags: [Jobs]
      summary: Show Stats
      description: Кількість job за статусом і за місяцями (6 останніх місяців, від старих до нових).
      operationId: ShowStats
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  defaultStats:
                    type: object
                    properties:
                      pending:
                        type: integer
                      interview:
                        type: integer
                      declined:
                        type: integer
                  monthlyApplications:
                    type: array
                    items:
                      type: object
                      properties:
                        date:
                          type: string
                          example: Nov 2026
                        count:
                          type: integer
  /jobs/{id}:
    parameters: # на рівні шляху — діє для get/patch/delete одразу
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: the job id
    get:
      tags: [Jobs]
      summary: Get Single Job
      operationId: GetSingleJob
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '404':
          description: Job not found
    patch:
      tags: [Jobs]
      summary: Update Job
      operationId: UpdateJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateJobRequest'
            example:
              company: google
              position: senior intern
              status: interview
              jobType: full-time
              jobLocation: Lviv
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobResponse'
        '400':
          description: Validation error, or demo user (read-only)
        '404':
          description: Job not found
    delete:
      tags: [Jobs]
      summary: Delete Job
      operationId: DeleteJob
      responses:
        '200':
          description: OK
        '400':
          description: Demo user (read-only)
        '404':
          description: Job not found
components:
  schemas:
    RegisterUserRequest:
      type: object
      required: [name, email, password] # дублює required зі схеми Mongoose — тримати в синхроні
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
    LoginUserRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    UpdateUserRequest:
      type: object
      required: [email, name, lastName, location] # контролер вимагає всі чотири
      properties:
        email:
          type: string
        name:
          type: string
        lastName:
          type: string
          maxLength: 20
        location:
          type: string
          maxLength: 20
    UserResponse: # token усередині user — фронт кладе весь user у localStorage
      type: object
      properties:
        user:
          type: object
          properties:
            email:
              type: string
            lastName:
              type: string
            location:
              type: string
            name:
              type: string
            token:
              type: string
    CreateJobRequest:
      type: object
      required: [company, position]
      properties:
        company:
          type: string
        position:
          type: string
        status:
          type: string
          enum: [interview, declined, pending]
        jobType:
          type: string
          enum: [full-time, part-time, remote, internship]
        jobLocation:
          type: string
    UpdateJobRequest:
      type: object
      properties:
        company:
          type: string
        position:
          type: string
        status:
          type: string
          enum: [interview, declined, pending]
        jobType:
          type: string
          enum: [full-time, part-time, remote, internship]
        jobLocation:
          type: string
    Job:
      type: object
      properties:
        _id:
          type: string
        company:
          type: string
        position:
          type: string
        status:
          type: string
          enum: [interview, declined, pending]
        jobType:
          type: string
          enum: [full-time, part-time, remote, internship]
        jobLocation:
          type: string
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    JobResponse:
      type: object
      properties:
        job:
          $ref: '#/components/schemas/Job'
  securitySchemes: # кнопка Authorize; UI сам додає 'Authorization: Bearer <token>'
    httpBearer:
      type: http
      scheme: bearer
security: # глобально: усі ендпоінти потребують токен, якщо не перекрито
  - httpBearer: []
tags:
  - name: Auth
  - name: Jobs
